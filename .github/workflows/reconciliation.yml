name: Bibliographic reconciliation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m scidownl_reconcile.benchmark tests/fixtures/reconciliation.json --output benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-benchmark-${{ matrix.python-version }}
          path: benchmark.json
